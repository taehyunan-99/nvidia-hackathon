services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: her2
      POSTGRES_USER: her2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U her2 -d her2"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "service.db"]
    environment: &api_environment
      DATABASE_URL: postgresql://her2:${POSTGRES_PASSWORD}@db:5432/her2
      SERVICE_DATA_ROOT: /data
      DATA_MODE: ${DATA_MODE:-mock}
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:${WEB_PORT:-8080}
      MAX_UPLOAD_BYTES: "20971520"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *api_environment
    volumes:
      - uploads:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "service.worker", "--scenario", "scientific-hold"]
    environment:
      <<: *api_environment
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LOGIC_AGENT_MODE: ${LOGIC_AGENT_MODE:-nat}
    volumes:
      - uploads:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  uploads:

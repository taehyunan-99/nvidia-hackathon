# Use with compose.server.yaml. CloudFront supplies the public domain and TLS.
# Restrict EC2 ingress to the CloudFront origin-facing prefix list before starting.
services:
  web:
    environment:
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:?Set a random origin verification secret}
    ports: !override
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes: !override
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
  worker:
    environment:
      # Empty in public operation: preserve per-run limits instead of sharing the test budget.
      MODEL_BUDGET_PATH: ${MODEL_BUDGET_PATH:-}
      NEMOTRON_REQUEST_LIMIT: ${NEMOTRON_REQUEST_LIMIT:-40}
      MODEL_DAILY_BUDGET_PATH: /data/model-daily-budget.sqlite3
      NEMOTRON_DAILY_REQUEST_LIMIT: ${NEMOTRON_DAILY_REQUEST_LIMIT:-4000}
      BOLTZ2_DAILY_REQUEST_LIMIT: ${BOLTZ2_DAILY_REQUEST_LIMIT:-200}
